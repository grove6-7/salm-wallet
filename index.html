<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Salm Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>:root{--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#000);--hint:var(--tg-theme-hint-color,#999);--btn:var(--tg-theme-button-color,#2481cc);--btn-text:var(--tg-theme-button-text-color,#fff);--secondary-bg:var(--tg-theme-secondary-bg-color,#f0f0f0)}body{background:var(--bg);color:var(--text);box-sizing:border-box;flex-direction:column;min-height:100vh;margin:0;padding:16px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;display:flex}.screen{flex-direction:column;flex-grow:1;display:none}.screen.active{display:flex}button{background:var(--btn);width:100%;color:var(--btn-text);cursor:pointer;border:none;border-radius:12px;margin:8px 0;padding:16px;font-size:16px;font-weight:600}button:active{opacity:.8}button.secondary{background:var(--secondary-bg);color:var(--text)}.box{background:var(--secondary-bg);word-break:break-all;border-radius:12px;margin:12px 0;padding:16px;font-size:14px}.hidden{display:none!important}h1{text-align:center;margin-bottom:8px;font-size:24px}h2{margin:16px 0 8px;font-size:18px}.center{text-align:center}.seed-words{grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;display:grid}.seed-word{background:var(--bg);border:1px solid var(--hint);border-radius:8px;padding:8px;font-family:monospace;font-size:14px}.seed-num{color:var(--hint);margin-right:8px;font-size:12px}textarea{border:1px solid var(--hint);background:var(--bg);width:100%;color:var(--text);box-sizing:border-box;resize:none;border-radius:12px;padding:12px;font-family:monospace;font-size:16px}#errorBox{color:#d32f2f;word-break:break-all;background:#ffebee;border-radius:12px;margin-top:auto;padding:12px;font-size:13px;display:none}.loading{color:var(--hint);text-align:center;margin-top:40px;font-size:18px}</style>
  <script type="module" crossorigin src="./assets/index-CuZOUPcm.js"></script>
</head>
<body>

  <div id="errorBox"></div>

  <!-- ЭКРАН 1: ЗАГРУЗКА -->
  <div id="screen-loading" class="screen active">
    <div class="loading">Загрузка кошелька...</div>
  </div>

  <!-- ЭКРАН 2: ПРИВЕТСТВИЕ -->
  <div id="screen-welcome" class="screen">
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
      <h1>Добро пожаловать</h1>
      <p class="center" style="color: var(--hint); margin-bottom: 32px;">Salm Wallet — безопасный кошелек на TON</p>
      <button id="btn-goto-create">Создать новый кошелек</button>
      <button id="btn-goto-import" class="secondary">У меня уже есть фраза</button>
    </div>
  </div>

  <!-- ЭКРАН 3: СОЗДАНИЕ (SEED) -->
  <div id="screen-create" class="screen">
    <h2 class="center">Ваша секретная фраза</h2>
    <p class="center" style="color: var(--hint); font-size: 13px;">Запишите эти 24 слова в правильном порядке. Никому их не показывайте.</p>
    
    <div class="box seed-words" id="seedContainer"></div>
    
    <div style="flex-grow: 1;"></div>
    <button id="btn-saved-seed">Я сохранил фразу</button>
  </div>

  <!-- ЭКРАН 4: ВХОД -->
  <div id="screen-import" class="screen">
    <h2 class="center">Вход в кошелек</h2>
    <p class="center" style="color: var(--hint); font-size: 13px;">Введите 24 слова через пробел</p>
    
    <textarea id="importInput" rows="6" placeholder="слово1 слово2 слово3 ..."></textarea>
    
    <div style="flex-grow: 1;"></div>
    <button id="btn-do-import">Войти</button>
    <button id="btn-cancel-import" class="secondary">Отмена</button>
  </div>

  <!-- ЭКРАН 5: ГЛАВНЫЙ ЭКРАН -->
  <div id="screen-main" class="screen">
    <h1>Мой кошелек</h1>
    
    <button id="toggleAddr" class="secondary">Показать адрес</button>
    <div id="addrBox" class="box hidden"></div>

    <div class="box" style="margin-top: 24px;">
      <h2 style="margin: 0 0 8px;">GRAM: <span id="gramBal">—</span></h2>
      <h2 style="margin: 0;">USDT: <span id="usdtBal">—</span></h2>
    </div>
    
    <div style="flex-grow: 1;"></div>
    <button id="btn-logout" class="secondary" style="color: #d32f2f;">Выйти и удалить кошелек</button>
  </div>

</body>
</html>
