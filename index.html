<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Salm Wallet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>:root{--bg:var(--tg-theme-bg-color,#0f0f11);--text:var(--tg-theme-text-color,#fff);--hint:var(--tg-theme-hint-color,#8e8e93);--btn:var(--tg-theme-button-color,#2ea6ff);--btn-text:var(--tg-theme-button-text-color,#fff);--secondary-bg:var(--tg-theme-secondary-bg-color,#1c1c1e);--card-bg:linear-gradient(145deg, #1e4e8c, #0d2a4d);--danger:#ff453a;--radius:16px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--text);flex-direction:column;min-height:100vh;margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;display:flex;overflow-x:hidden}.screen{flex-direction:column;flex-grow:1;animation:.4s cubic-bezier(.16,1,.3,1) fadeIn;display:none}.screen.active{display:flex}@keyframes fadeIn{0%{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}h1{letter-spacing:-.5px;margin:0 0 8px;font-size:26px;font-weight:700}h2{margin:0 0 4px;font-size:20px;font-weight:600}p{color:var(--hint);margin:0 0 16px;font-size:15px;line-height:1.4}button{border-radius:var(--radius);background:var(--btn);width:100%;color:var(--btn-text);cursor:pointer;border:none;padding:16px;font-size:17px;font-weight:600;transition:opacity .2s,transform .1s}button:active{opacity:.8;transform:scale(.97)}button.secondary{background:var(--secondary-bg);color:var(--btn)}button.danger{color:var(--danger);background:0 0}.balance-card{background:var(--card-bg);color:#fff;border:1px solid #ffffff1a;border-radius:24px;margin-bottom:24px;padding:24px;position:relative;box-shadow:0 12px 24px #0006}.balance-card h3{opacity:.7;text-transform:uppercase;letter-spacing:1px;margin:0 0 12px;font-size:12px;font-weight:600}.balance-card .amount{letter-spacing:-1px;align-items:baseline;gap:8px;margin-bottom:8px;font-size:34px;font-weight:700;display:flex}.balance-card .amount span{opacity:.8;letter-spacing:0;font-size:16px;font-weight:500}.balance-card .address{background:#0000004d;border:1px solid #ffffff0d;border-radius:10px;margin-top:12px;padding:8px 12px;font-family:monospace;font-size:13px;display:inline-block}.actions-row{gap:16px;margin-bottom:24px;display:flex}.action-btn{background:var(--secondary-bg);color:var(--text);border-radius:var(--radius);cursor:pointer;border:1px solid #ffffff0d;flex-direction:column;flex:1;justify-content:center;align-items:center;gap:8px;padding:16px;font-size:14px;font-weight:600;transition:opacity .2s,transform .1s;display:flex}.action-btn:active{opacity:.7;transform:scale(.97)}.action-btn svg{width:28px;height:28px;fill:var(--btn)}.seed-grid{background:var(--secondary-bg);border-radius:var(--radius);grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;padding:16px;display:grid}.seed-word{background:#ffffff0d;border:1px solid #ffffff0d;border-radius:10px;align-items:center;padding:10px 12px;font-family:monospace;font-size:15px;display:flex}.seed-num{color:var(--hint);margin-right:10px;font-size:12px;font-weight:700}textarea{border-radius:var(--radius);border:2px solid var(--secondary-bg);background:var(--secondary-bg);width:100%;color:var(--text);resize:none;outline:none;padding:16px;font-family:monospace;font-size:16px;transition:border-color .2s}textarea:focus{border-color:var(--btn)}.bottom-panel{flex-direction:column;gap:12px;margin-top:auto;padding-top:16px;display:flex}.toast-container{z-index:1000;pointer-events:none;flex-direction:column;align-items:center;display:flex;position:fixed;bottom:24px;left:20px;right:20px}.toast{-webkit-backdrop-filter:blur(12px);color:#fff;pointer-events:auto;background:#282828d9;border:1px solid #ffffff1a;border-radius:16px;align-items:center;gap:12px;width:100%;max-width:400px;margin-top:10px;padding:16px 20px;font-size:15px;font-weight:500;transition:transform .2s,opacity .2s;animation:.3s cubic-bezier(.16,1,.3,1) forwards toastIn;display:flex;position:relative;overflow:hidden;box-shadow:0 10px 30px #00000080}.toast.error{background:#ff453ae6;border-color:#ff645a4d}.toast.success{background:#34c759e6;border-color:#50dc784d}.toast-icon{flex-shrink:0;font-size:20px}.toast-progress{background:#fff9;width:100%;height:3px;animation:5s linear forwards progressShrink;position:absolute;bottom:0;left:0}@keyframes progressShrink{0%{width:100%}to{width:0%}}@keyframes toastIn{0%{opacity:0;transform:translateY(50px)scale(.9)}to{opacity:1;transform:translateY(0)scale(1)}}.toast.swiped{opacity:0;transform:translateY(100px)}.loading-spinner{border:3px solid #ffffff1a;border-top-color:var(--btn);border-radius:50%;width:36px;height:36px;margin:40px auto;animation:1s linear infinite spin}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}.logo-placeholder{background:linear-gradient(135deg,#2ea6ff,#06c);border-radius:24px;justify-content:center;align-items:center;width:84px;height:84px;margin:0 auto 24px;display:flex;box-shadow:0 8px 24px #2ea6ff4d}</style>
  <script type="module" crossorigin src="./assets/index-BsY7nw5B.js"></script>
</head>
<body>

  <!-- Контейнер для плашек -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- ЭКРАН 1: ЗАГРУЗКА -->
  <div id="screen-loading" class="screen active">
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- ЭКРАН 2: ПРИВЕТСТВИЕ -->
  <div id="screen-welcome" class="screen">
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
      <div style="text-align: center; margin-bottom: 40px;">
        <div class="logo-placeholder">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="white"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </div>
        <h1>Salm Wallet</h1>
        <p>Самый простой и безопасный кошелек для TON, USDT и GRAM</p>
      </div>
      <div class="bottom-panel">
        <button id="btn-goto-create">Создать новый кошелек</button>
        <button id="btn-goto-import" class="secondary">У меня уже есть фраза</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 3: СОЗДАНИЕ -->
  <div id="screen-create" class="screen">
    <h1>Секретная фраза</h1>
    <p>Запишите эти 24 слова. <b>Никому их не показывайте.</b></p>
    
    <div class="seed-grid" id="seedContainer"></div>
    
    <div class="bottom-panel">
      <button id="btn-saved-seed">Я сохранил фразу</button>
      <button id="btn-cancel-create" class="secondary">Отмена</button>
    </div>
  </div>

  <!-- ЭКРАН 4: ВХОД -->
  <div id="screen-import" class="screen">
    <h1>Вход</h1>
    <p>Введите 24 слова вашей секретной фразы через пробел.</p>
    
    <textarea id="importInput" rows="5" placeholder="слово1 слово2 слово3 ..."></textarea>
    
    <div class="bottom-panel">
      <button id="btn-do-import">Войти</button>
      <button id="btn-cancel-import" class="secondary">Отмена</button>
    </div>
  </div>

  <!-- ЭКРАН 5: ГЛАВНЫЙ -->
  <div id="screen-main" class="screen">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; margin-top: 10px;">
      <h1 style="margin: 0; font-size: 22px; letter-spacing: -0.5px;">Salm Wallet</h1>
      <div style="width: 44px; height: 44px; background: var(--secondary-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.05);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--hint)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </div>
    </div>

    <div class="balance-card">
      <h3>Общий баланс</h3>
      <div class="amount"><span id="gramBal">0.0000</span> <span>GRAM</span></div>
      <div class="amount" style="font-size: 28px;"><span id="usdtBal">0.00</span> <span>USDT</span></div>
      <div class="address" id="mainAddrDisplay">UQ...</div>
    </div>

    <div class="actions-row">
      <div class="action-btn" id="btn-copy-addr">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        <span>Копировать</span>
      </div>
      <div class="action-btn" id="btn-refresh">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        <span>Обновить</span>
      </div>
    </div>

    <div class="bottom-panel">
      <button id="btn-logout" class="danger">Выйти и удалить кошелек</button>
    </div>
  </div>

</body>
</html>
